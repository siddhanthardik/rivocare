```

#### `client/.env.example`
Mirror with placeholders. Always keep in sync.

**Rules:**
- `.env` is ALWAYS in `.gitignore` — verify this
- `.env.example` is ALWAYS committed to git
- Never hardcode secrets anywhere in source code
- Scan the entire codebase for raw `process.env.X` usage and redirect to a config module

