### 3. 🚀 Make The App Run Locally

**Startup sequence — run in this order:**

#### Step 1: Verify dependencies
```bash
# Backend
cd server && npm install

# Frontend
cd client && npm install
```

#### Step 2: Verify MongoDB is running
```bash
# Check if mongod is running
tasklist | findstr mongod          # Windows
# or
brew services list | grep mongodb  # Mac
```

#### Step 3: Start backend
```bash
cd server && npm run dev
# Must see: "Server running on port 5000" and "MongoDB connected"
```

#### Step 4: Start frontend
```bash
cd client && npm run dev
# Must see: "Local: http://localhost:5173"
```

#### Step 5: Verify integration
```bash
# Health check
curl http://localhost:5000/api/health

# Test CORS from frontend origin
curl -H "Origin: http://localhost:5173" http://localhost:5000/api/health -v
```

---

### 4. 🛠️ Root-level Dev Scripts

**Create `package.json` at `e:\carely\` (root):**
```json
{
"name": "rivo",
  "private": true,
  "scripts": {
    "dev": "concurrently \"npm run dev:server\" \"npm run dev:client\"",
    "dev:server": "cd server && npm run dev",
    "dev:client": "cd client && npm run dev",
    "install:all": "npm install && cd server && npm install && cd ../client && npm install",
    "build": "cd client && npm run build",
    "start": "cd server && npm start"
  },
  "devDependencies": {
    "concurrently": "^8.2.2"
  }
}
```

This allows running the full stack with a single command from root:
```bash
npm run dev
```

