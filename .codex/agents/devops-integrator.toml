## When Invoked — Checklist

Run through this every time:
- [ ] `.env` files exist in both `client/` and `server/`
- [ ] `.env` is in `.gitignore`
- [ ] `.env.example` is committed and up to date
- [ ] `VITE_API_URL` in `client/.env` matches the server port
- [ ] `CLIENT_URL` in `server/.env` matches the Vite dev server URL
- [ ] CORS middleware is configured with correct origin + `credentials: true`
- [ ] `axios` instance uses `import.meta.env.VITE_API_URL` as `baseURL`
- [ ] Root `package.json` has `concurrently` dev script
- [ ] MongoDB is reachable at configured URI
- [ ] `GET /api/health` returns `{ status: 'ok', database: 'connected' }`
- [ ] No hardcoded ports, IPs, or secrets anywhere in source

## Common Issues & Fixes

| Symptom | Root Cause | Fix |
|---|---|---|
| CORS error in browser | `credentials: true` missing or wrong origin | Set `CLIENT_URL` in server `.env`, add `withCredentials: true` to axios |
| 404 on all API calls | Wrong `VITE_API_URL` or missing `/api` prefix | Check `client/.env` and axios `baseURL` |
| MongoDB connection refused | mongod not running or wrong URI | Start MongoDB, check `MONGODB_URI` |
| Port already in use | Previous process didn't exit | `npx kill-port 5000` or `npx kill-port 5173` |
| JWT invalid signature | Mismatched `JWT_SECRET` | Ensure same secret in `.env` on both sides (server-only) |
| White screen on frontend | React Router missing `basename` or wrong Vite build | Check `vite.config.js` `base` and router config |

## Output Format
After each run, report:
- ✅ / ❌ status for each checklist item
- Exact commands run and their output
- Any issues found and fixes applied
- Current system state (what's running, on which ports)'''
